    <script>
      // Safeguard for browser extensions / iframe inspectors attempting to assign window.fetch
      (function() {
        try {
          var _origFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          var _currentFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _currentFetch;
            },
            set: function(val) {
              _currentFetch = val;
            }
          });
        } catch (_err) {
          // Continue if already configured or immutable
        }
      })();
    </script>
